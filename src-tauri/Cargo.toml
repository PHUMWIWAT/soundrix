[package]
name = "soundrix"
version = "0.1.0"
description = "Desktop soundboard"
authors = ["PHUMWIWAT"]
edition = "2024"

[lib]
name = "soundrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundrix-core = { path = "../crates/soundrix-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
