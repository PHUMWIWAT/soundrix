[package]
name = "soundrix"
version = "0.1.1"
description = "Desktop soundboard"
authors = ["PHUMWIWAT"]
edition = "2024"

[lib]
name = "soundrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundrix-core = { path = "../crates/soundrix-core" }
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "ogg", "pcm", "vorbis", "isomp4", "aac", "alac"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
